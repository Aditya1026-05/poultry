services:
  # ==========================================
  # FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: star-poultry-backend
    restart: unless-stopped
    ports:
      # Bound strictly to host loopback (prevents public port exposure on EC2)
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - star-poultry-network

  # ==========================================
  # React Frontend Service (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: star-poultry-frontend
    restart: unless-stopped
    ports:
      # Defaults to 8080:80 for local dev. On EC2, set FRONTEND_PORT=80 in root .env
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - star-poultry-network

# ==========================================
# Isolated Application Network
# ==========================================
networks:
  star-poultry-network:
    driver: bridge
