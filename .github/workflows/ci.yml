name: Continuous Integration & Deployment

'on':
  push:
    branches: [ aws-deployment ]
  pull_request:
    branches: [ aws-deployment ]

# Cancel in-progress runs when a new commit is pushed to aws-deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Frontend Verification
  # ==========================================
  frontend-check:
    name: Frontend (Vite & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Frontend Production Bundle
        run: npm run build
        env:
          VITE_API_URL: /api

  # ==========================================
  # JOB 2: Backend Verification
  # ==========================================
  backend-check:
    name: Backend (Python & FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Bytecode Compilation Check
        run: python -m compileall app

      - name: FastAPI Application Boot & Router Import Check
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB: "ci_test_db"
          JWT_SECRET: "ci-dummy-jwt-secret-minimum-32-chars-long"
        run: |
          python -c "from app.main import app; print('✓ FastAPI application initialized successfully:', app.title)"

  # ==========================================
  # JOB 3: Docker Build Verification
  # ==========================================
  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-check, backend-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: poultry-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: poultry-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 4: Automated Continuous Deployment
  # ==========================================
  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build-check]
    # Deploy only on pushes to aws-deployment (never on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/aws-deployment'
    steps:
      - name: Deploy Containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/poultry
            git pull origin aws-deployment
            docker compose up -d --build

      - name: Verify Live Production Health
        run: |
          echo "Verifying live application health on EC2..."
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "http://${{ secrets.EC2_HOST }}/api/health"
          echo "✓ Production deployment is live and healthy!"
